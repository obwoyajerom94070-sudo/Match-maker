<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Maker</title>
<style>
:root{--bg:#fff1f3;--card:#ffffff;--ink:#3b1a2a;--muted:#8a6575;--line:#f0c9d4;--accent:#d6336c;--accent2:#7c3aed;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f17;--card:#2a1622;--ink:#fde7ee;--muted:#c99aae;--line:#4a2a3b;--accent:#ff6b9a;--accent2:#b794f6;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#1d0f17;--card:#2a1622;--ink:#fde7ee;--muted:#c99aae;--line:#4a2a3b;--accent:#ff6b9a;--accent2:#b794f6;--err:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;transition:background .6s}
body.hot{background:color-mix(in srgb,var(--bg),#ff4d7d 18%)}
body.cold{background:color-mix(in srgb,var(--bg),#4d7dff 14%)}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;text-align:center;position:relative;overflow:hidden}
h1{margin:0 0 4px;font-size:2rem;font-weight:700}
.sub{margin:0 0 22px;color:var(--muted);font-size:.95rem}
label{display:block;text-align:left;font-size:.9rem;margin:12px 0 6px}
input{width:100%;padding:12px 14px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.amp{font-size:1.6rem;color:var(--accent);margin:6px 0 0}
button{margin-top:20px;width:100%;padding:14px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;border-radius:12px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.97)}
.err{min-height:1.3em;margin:10px 0 0;color:var(--err);font-size:.9rem}
#result{margin-top:10px;min-height:150px}
.heart{font-size:3.4rem;display:inline-block;line-height:1}
.heart.beat{animation:beat .9s ease-out 2}
@keyframes beat{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.3);opacity:1}70%{transform:scale(.95)}100%{transform:scale(1)}}
.score{font-size:3rem;font-weight:700;color:var(--accent);margin:4px 0}
.msg{margin:0;color:var(--ink)}
.bar{height:10px;margin:14px 0 0;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 1.2s ease-out}
.float{position:absolute;bottom:-20px;pointer-events:none;animation:up 2.2s ease-in forwards}
@keyframes up{to{transform:translateY(-480px) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart.beat,.float{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Match Maker</h1>
  <p class="sub">Enter two names to see how well they match.</p>
  <label for="a">First name</label>
  <input id="a" type="text" maxlength="30" autocomplete="off" placeholder="e.g. Romeo">
  <div class="amp" aria-hidden="true">&amp;</div>
  <label for="b">Second name</label>
  <input id="b" type="text" maxlength="30" autocomplete="off" placeholder="e.g. Juliet">
  <button id="go" type="button">Check compatibility</button>
  <p class="err" id="err" role="alert"></p>
  <div id="result" aria-live="polite"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const a=$("a"),b=$("b"),err=$("err"),res=$("result");
function message(s){
  if(s>=90)return["💖","Soulmates! A perfect match."];
  if(s>=75)return["💘","Great chemistry. This could be something special."];
  if(s>=50)return["💞","A solid spark. Worth a coffee date."];
  if(s>=25)return["💛","Opposites might attract. It takes some effort."];
  return["💔","Not quite a match. Friendship might be safer."];
}
function burst(emoji){
  const m=document.querySelector("main");
  for(let i=0;i<14;i++){
    const s=document.createElement("span");
    s.className="float";s.textContent=emoji;
    s.style.left=Math.random()*90+"%";
    s.style.fontSize=(14+Math.random()*18)+"px";
    s.style.animationDelay=(Math.random()*.6)+"s";
    m.appendChild(s);setTimeout(()=>s.remove(),3000);
  }
}
function generate(){
  const n1=a.value.trim(),n2=b.value.trim();
  err.textContent="";
  if(!n1||!n2){err.textContent="Please enter both names.";return;}
  if(n1.toLowerCase()===n2.toLowerCase()){err.textContent="Names must be different. You can't match someone with themselves.";return;}
  const score=Math.floor(Math.random()*101);
  const [emoji,text]=message(score);
  res.innerHTML="";
  const h=document.createElement("div");h.className="heart";h.textContent=emoji;
  const sc=document.createElement("div");sc.className="score";sc.textContent=score+"%";
  const p=document.createElement("p");p.className="msg";
  p.textContent=n1+" & "+n2+": "+text;
  const bar=document.createElement("div");bar.className="bar";
  const fill=document.createElement("i");bar.appendChild(fill);
  res.append(h,sc,p,bar);
  void h.offsetWidth;h.classList.add("beat");
  requestAnimationFrame(()=>requestAnimationFrame(()=>fill.style.width=score+"%"));
  document.body.classList.remove("hot","cold");
  if(score>=50)document.body.classList.add("hot");else document.body.classList.add("cold");
  burst(score>=50?"❤️":"💔");
}
$("go").addEventListener("click",generate);
[a,b].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")generate();}));
</script>
</body>
</html>
